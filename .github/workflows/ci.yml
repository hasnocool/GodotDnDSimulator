name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"

jobs:
  engine:
    name: Python engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without action runtime dependencies
        shell: bash
        run: |
          git clone --depth 1 --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Provision Python 3.12
        shell: bash
        run: |
          if ! command -v python3.12 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3.12 python3.12-venv
          fi
          python3.12 --version
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Ruff
        run: .venv/bin/ruff check .
      - name: Mypy
        run: .venv/bin/mypy engine/src
      - name: Pytest with coverage
        run: .venv/bin/pytest --cov=godot_dnd_engine --cov-report=term-missing
      - name: Determinism smoke test
        run: .venv/bin/python scripts/determinism_smoke.py

  governance:
    name: Governance and schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without action runtime dependencies
        shell: bash
        run: |
          git clone --depth 1 --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Ensure Python 3.12
        shell: bash
        run: |
          if ! command -v python3.12 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3.12
          fi
          python3.12 --version
      - name: Governance checks
        run: python3.12 scripts/check_governance.py
      - name: Validate JSON syntax
        shell: bash
        run: |
          python3.12 -m json.tool schemas/v1/command.schema.json >/dev/null
          python3.12 -m json.tool schemas/v1/event.schema.json >/dev/null
          python3.12 -m json.tool schemas/v1/snapshot.schema.json >/dev/null

  godot:
    name: Godot project validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without action runtime dependencies
        shell: bash
        run: |
          git clone --depth 1 --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Verify Godot version
        run: "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version
      - name: Parse project headlessly
        run: "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path apps/godot-client --editor --quit
