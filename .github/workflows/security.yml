name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  repository-security:
    name: Secrets and Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pip-audit
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'pip-audit>=2.9,<3'
      - name: High-signal secret scan
        run: python scripts/check_secrets.py
      - name: Python dependency vulnerability audit
        run: python -m pip_audit
