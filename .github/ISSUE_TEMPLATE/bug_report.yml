name: Bug report
description: Report a reproducible engine, Godot client, tooling, or content defect
title: "bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include deterministic seed, command/event fixture, save, or scene steps when applicable.
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - Headless engine
        - Godot client
        - Rules/content pipeline
        - Save/replay
        - Tooling/CI
        - Documentation/governance
        - Other
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility / data-loss risk
      description: Note any save, replay, schema, licensing, or data-loss implications.
