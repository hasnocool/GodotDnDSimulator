[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "godot-dnd-engine"
version = "0.8.0.dev0"
description = "Deterministic headless simulation engine for GodotDnDSimulator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary project code; see repository licensing documentation" }
authors = [{ name = "GodotDnDSimulator contributors" }]
dependencies = [
  "pytest-asyncio>=1.4,<2",
]

[project.scripts]
godot-dnd-client-bridge = "godot_dnd_engine.spell_bridge:main"

[project.optional-dependencies]
rules = [
  "httpx>=0.28.1,<1",
  "jsonschema>=4.26,<5",
  "pypdf>=6.15,<7",
]
dev = [
  "httpx>=0.28.1,<1",
  "jsonschema>=4.26,<5",
  "mypy>=1.15",
  "pypdf>=6.15,<7",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.setuptools]
package-dir = {"" = "engine/src"}

[tool.setuptools.packages.find]
where = ["engine/src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["godot_dnd_engine", "tools.rules_importer"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "engine/src"
